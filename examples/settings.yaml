# 全調整項目の既定値。必要なキーだけ残して利用できる UTF-8 YAML。
# 説明・優先順位・固定する構造: docs/CONFIGURATION.md
# 値を変えると検出結果が変わる場合がある。元のレポートと比較して調整する。
# PDF の描画解像度（dpi、整数72〜1200、既定300）。大きいほど細部と処理量が増える。
dpi: 300
# 画像のmm換算用（dpi、整数72〜1200）。省略時は --dpi を含む最終dpiに追従。
# 明示すると --dpi では変わらない。PDFと画像を混在させる場合はdpiをそろえる。
# image_dpi: 300
diff:
  # 局所ずれの許容幅（mm、0以上、既定0.15）。0は吸収なし。大きいほど探索量・吸収が増える。
  max_shift_mm: 0.15
  # 色差のしきい値（Lab各チャンネル差、0以上、既定3）。上げると小さい色差を検出しにくい。
  color_threshold: 3.0
  # 輪郭の許容係数（0以上1未満、既定0.3）。0はぼかしなしの厳密比較。
  edge_tolerance: 0.3
ink:
  # 局所背景の半径（mm、0より大きく20以下、既定1.5）。吸収・分類・移動で共通。
  # 大きいほど広い塗りもインクに含まれやすい。差分検出自体にも影響する。
  background_radius_mm: 1.5
  # 背景からの明度差（Lab L、0〜100、既定25）。この値を超える画素がインク。
  # 上げると薄い文字・線を含めにくくなり、100ではインクがなくなる。
  contrast_threshold: 25.0
cluster:
  # 横方向の結合間隔（mm、0以上、既定3）。大きいほど離れた差分をまとめる。
  merge_x_mm: 3.0
  # 縦方向の結合間隔（mm、0以上、既定1）。大きいほど異なる行もまとめやすい。
  merge_y_mm: 1.0
  # 採用に必要な生差分画素数（整数1以上、既定4）。未満はノイズとして除外・記録。
  min_pixels: 4
  # ページの採用上限（件、整数1以上、既定500）。超過時は大きい成分を残して警告。
  max_clusters_per_page: 500
  # 差分割合の上限（0より大きく1以下、既定0.30）。超過するとtoo_different。
  max_diff_ratio: 0.30
  # 左から右に番号を付ける横帯の高さ（mm、0より大きく1000以下、既定5）。
  # 番号順と、上限超過時に同画素数の成分を選ぶ順序に影響する。
  reading_band_mm: 5.0
move:
  # 移動注釈の各軸の探索距離（mm、0〜20、既定5）。0は移動注釈なし。
  search_mm: 5.0
  # 一致度の下限（0より大きく1以下、既定0.98）。上げると推定を厳しくする。
  min_score: 0.98
  # 次点との差の下限（0より大きく1以下、既定0.02）。上げると曖昧な候補を見送る。
  min_score_gap: 0.02
  # テンプレート余白（mm、0〜20、既定1）。切り上げ、最低1px。
  # 大きいほど周囲の変更やページ端の影響で推定を見送りやすい。
  template_margin_mm: 1.0
align:
  # 全体補正の有効化（true/false、既定false）。帳票全体の移動を許容する場合に有効化。
  enabled: false
  # 各軸の探索上限（mm、0〜20、既定5）。0は探索を省略。
  max_shift_mm: 5.0
  # 全体と支持区画の一致度の下限（0より大きく1以下、既定0.98）。上げると厳しくする。
  min_score: 0.98
  # 次点との差の下限（0より大きく1以下、既定0.02）。上げると曖昧な候補を見送る。
  min_score_gap: 0.02
  # 全体と支持区画の改善量の下限（0より大きく1以下、既定0.05）。上げると厳しくする。
  min_improvement: 0.05
  # 粗い格子の長辺の目安上限（計算要素数、整数64〜4096、既定800）。
  # 大きいほど細部を残すが探索量が増える。物理的な長さの指定ではない。
  coarse_max_side_samples: 800
  # 各復元段階で候補周囲を探す半径（各軸の計算要素数、整数1〜8、既定2）。
  # 小さいと粗い段階の誤差を補えず、大きいと探索量が増える。
  refine_radius_samples: 2
  # 固定3×3格子で必要な支持区画（整数1〜9、既定3）。行数・列数の条件も必須。
  # 下げると局所移動を全体移動と扱う可能性が増える。
  min_support_cells: 3
  # 支持区画がまたがる最小行数（整数1〜3、既定2）。下げると縦方向の分散条件が弱まる。
  min_support_rows: 2
  # 支持区画がまたがる最小列数（整数1〜3、既定2）。下げると横方向の分散条件が弱まる。
  min_support_columns: 2
  # 支持区画ごと・A/B各側の最低情報量（黒換算mm²、0より大きく10000以下、既定1）。
  # 上げると情報の少ないページでの補正を見送る。
  min_ink_area_mm2: 1.0
text:
  # ページ・片側の文字要素上限（件、整数1〜1000000、既定100000）。超過時は注釈を省略。
  max_letters_per_page: 100000
  # ページ・片側の単語上限（件、整数1〜200000、既定20000）。超過時は注釈を省略。
  # 件数上限はPDFパーサー自体の実行時間・メモリの強制上限ではない。
  max_words_per_page: 20000
  # クラスタ・片側の本文上限（Unicodeスカラー値数、整数1〜100000、既定2000）。
  # 超過時は最後の1文字を「…」にし警告する。画像比較には影響しない。
  max_runes_per_cluster: 2000
  # 同じ行とする縦の重なり率（0より大きく1以下、既定0.5）。短い方の高さが基準。
  # 行の先頭語と比較。上げると別行に分かれやすくなる。
  min_line_overlap: 0.5
# 除外矩形の配列（既定は空）。比較・移動・全体補正・PDF注釈に適用する。
exclude: []
# 除外する場合は上の exclude: [] を置き換える。
# page: all または1以上の整数（必須）。対象ページを選ぶ。
# x/y: 左上位置、w/h: 幅・高さ（mm、0以上、必須）。0の幅・高さは空領域。
# note: 任意の説明文字列（既定は空）。レポートに表示し、判定には使わない。
# exclude:
#   - {page: all, x: 150, y: 8, w: 50, h: 6, note: 出力日時}
#   - {page: 2, x: 10, y: 270, w: 80, h: 10, note: 担当者欄}
report:
  # 切り出し余白（mm、0以上、既定2）。表示用の範囲だけを変え、検出には影響しない。
  crop_margin_mm: 2.0
  # HTML からコピーする除外 YAML の余白。0〜20mm。切り出し画像とは独立。
  snippet_margin_mm: 1.0
  # 判定から独立した赤青の確認用画像。補正前の元 A/B を使用する。
  # true なら相違なしを含む選択全ページに保存。--raw-overlay は常に true を優先する。
  raw_overlay: false
