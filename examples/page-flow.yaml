# v0.1.5以降用。v0.1.4以前ではrowsは未知キーとなる。
# 行整列に加え、隣接する物理ページへの送りを、成立した原因ごとに集約する。
# 固定ヘッダー・フッター、一定行間隔、送り帯の全画素一致が必要。
# align.enabled: true との併用は、全ページが対応し縦方向の補正だけの場合に検証する。
# 横補正、補正と片側ページの組合せ、条件を満たさない文書は従来の比較へ戻る。
# 送りも相違として残り、ページ別内訳と集約後の件数を併記する。
rows:
  enabled: true
  carry_enabled: true
report:
  raw_overlay: true
